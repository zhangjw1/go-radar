{{define "shell_start"}}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Page.AppName}}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css">
  <style>
    :root {
      --radar-sidebar-width: 17rem;
      --radar-line: #dce3ec;
      --radar-muted: #66758a;
      --radar-ink: #182433;
      --radar-green: #2fb344;
      --radar-orange: #f76707;
      --radar-red: #d63939;
    }
    body {
      background: #f6f8fb;
      color: var(--radar-ink);
      letter-spacing: 0;
    }
    .app-shell {
      min-height: 100vh;
    }
    .navbar-vertical {
      width: var(--radar-sidebar-width);
      border-right: 1px solid var(--radar-line);
      box-shadow: 0 10px 30px rgba(24, 36, 51, 0.05);
    }
    .navbar-brand {
      justify-content: flex-start;
      gap: .75rem;
      padding: 1.25rem 1.25rem .75rem;
    }
    .brand-mark {
      width: 2.25rem;
      height: 2.25rem;
      border-radius: .5rem;
      background: var(--tblr-primary);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      box-shadow: 0 .5rem 1.2rem rgba(32, 107, 196, .22);
    }
    .brand-title {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.1;
    }
    .brand-subtitle {
      color: var(--radar-muted);
      font-size: .75rem;
      margin-top: .15rem;
    }
    .sidebar-group-title {
      color: var(--radar-muted);
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: .9rem 1.25rem .35rem;
    }
    .sidebar-nav {
      padding: 0 .75rem;
    }
    .sidebar-link {
      color: #344050;
      border-radius: .5rem;
      padding: .62rem .75rem;
      margin-bottom: .2rem;
      text-decoration: none;
      display: block;
    }
    .sidebar-link:hover {
      background: rgba(32, 107, 196, .06);
      color: var(--tblr-primary);
    }
    .sidebar-link.active {
      background: rgba(32, 107, 196, .1);
      color: var(--tblr-primary);
      font-weight: 600;
    }
    .sidebar-link-title {
      font-size: .9rem;
      line-height: 1.25;
    }
    .sidebar-link-subtitle {
      color: var(--radar-muted);
      font-size: .72rem;
      line-height: 1.35;
      margin-top: .12rem;
    }
    .page-wrapper {
      margin-left: var(--radar-sidebar-width);
      min-height: 100vh;
    }
    .page-body {
      padding: 1.5rem;
    }
    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }
    .page-title {
      font-size: 1.65rem;
      font-weight: 700;
      line-height: 1.15;
      margin: 0;
    }
    .page-subtitle {
      color: var(--radar-muted);
      margin-top: .45rem;
      font-size: .92rem;
    }
    .page-actions {
      display: flex;
      gap: .5rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .action-link,
    .soft-pill {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      min-height: 2.25rem;
      padding: .45rem .75rem;
      border: 1px solid var(--radar-line);
      border-radius: .5rem;
      background: #fff;
      color: #526276;
      text-decoration: none;
      font-size: .86rem;
    }
    .action-link:hover {
      color: var(--tblr-primary);
      border-color: rgba(32, 107, 196, .35);
      text-decoration: none;
    }
    .card {
      border-color: var(--radar-line);
      box-shadow: 0 .25rem 1.2rem rgba(24, 36, 51, .05);
      padding: 1.1rem;
      border-radius: .65rem;
      margin-bottom: 1rem;
    }
    .card h2,
    .card h3 {
      margin-top: 0;
      font-size: 1.05rem;
      font-weight: 700;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr));
      gap: 1rem;
    }
    .stat-card {
      background: #fff;
      border: 1px solid var(--radar-line);
      border-radius: .65rem;
      padding: 1rem;
      box-shadow: 0 .25rem 1.2rem rgba(24, 36, 51, .05);
    }
    .stat-label {
      color: var(--radar-muted);
      font-size: .82rem;
    }
    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.1;
      margin-top: .35rem;
    }
    .stat-meta,
    .small-muted,
    .table-note,
    .muted,
    .list-secondary {
      color: var(--radar-muted);
    }
    .stat-meta,
    .table-note,
    .small-muted,
    .list-secondary {
      font-size: .78rem;
      line-height: 1.45;
    }
    .subtle-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(13.5rem, 1fr));
      gap: .75rem;
    }
    .signal-meta-card {
      border: 1px solid var(--radar-line);
      border-radius: .65rem;
      padding: .9rem;
      background: #fff;
      transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
    }
    .signal-meta-card:hover {
      border-color: rgba(32, 107, 196, .35);
      box-shadow: 0 .5rem 1.4rem rgba(24, 36, 51, .08);
      transform: translateY(-1px);
    }
    .signal-meta-card h4 {
      font-size: .95rem;
      font-weight: 700;
      margin: 0 0 .4rem;
    }
    .two-col {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(18rem, 1fr);
      gap: 1rem;
    }
    .list-card {
      display: grid;
      gap: .25rem;
    }
    .list-row {
      display: grid;
      grid-template-columns: 8.5rem minmax(0, 1fr) auto;
      gap: .75rem;
      align-items: center;
      padding: .7rem 0;
      border-bottom: 1px solid var(--radar-line);
    }
    .list-row:last-child {
      border-bottom: none;
    }
    .list-primary {
      font-weight: 600;
    }
    table {
      width: 100%;
      font-size: .86rem;
      border-collapse: collapse;
    }
    th {
      color: #344050;
      font-weight: 700;
      background: #f8fafc;
    }
    th,
    td {
      padding: .65rem .55rem;
      border-bottom: 1px solid var(--radar-line);
      vertical-align: top;
      text-align: left;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: .18rem .55rem;
      background: rgba(32, 107, 196, .1);
      color: var(--tblr-primary);
      font-size: .76rem;
      font-weight: 600;
      line-height: 1.4;
    }
    .source-pill {
      background: rgba(32, 107, 196, .1);
      color: var(--tblr-primary);
    }
    .type-pill {
      background: #eef1f4;
      color: #3a4859;
    }
    .priority-high {
      color: var(--radar-red);
      font-weight: 700;
    }
    .priority-medium {
      color: var(--radar-orange);
      font-weight: 700;
    }
    .priority-low {
      color: var(--radar-green);
      font-weight: 700;
    }
    .filters,
    form.inline {
      display: flex;
      gap: .75rem;
      flex-wrap: wrap;
      align-items: end;
    }
    label {
      color: #344050;
      font-size: .84rem;
      font-weight: 600;
    }
    input,
    select,
    textarea {
      min-height: 2.25rem;
      border: 1px solid var(--radar-line);
      border-radius: .45rem;
      padding: .42rem .65rem;
      background: #fff;
      color: #182433;
      font: inherit;
      font-weight: 400;
    }
    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--tblr-primary);
      outline: 0;
      box-shadow: 0 0 0 .2rem rgba(32, 107, 196, .12);
    }
    button {
      min-height: 2.25rem;
      border: 1px solid var(--tblr-primary);
      border-radius: .45rem;
      padding: .42rem .85rem;
      background: var(--tblr-primary);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      word-break: break-all;
    }
    .placeholder-panel {
      min-height: 13rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .placeholder-kpis {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: .6rem;
    }
    .placeholder-kpi {
      border: 1px dashed var(--radar-line);
      border-radius: .55rem;
      padding: .75rem;
      background: #fbfcfe;
    }
    .placeholder-kpi-value {
      font-size: 1.35rem;
      font-weight: 700;
      margin-top: .25rem;
    }
    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: .75rem;
      margin-bottom: .9rem;
    }
    .section-title h2,
    .section-title h3 {
      margin: 0;
    }
    @media (max-width: 991.98px) {
      .navbar-vertical {
        width: 100%;
        position: static !important;
        border-right: 0;
        border-bottom: 1px solid var(--radar-line);
      }
      .page-wrapper {
        margin-left: 0;
      }
      .page-body {
        padding: 1rem;
      }
      .page-head {
        display: block;
      }
      .page-actions {
        justify-content: flex-start;
        margin-top: .75rem;
      }
      .two-col,
      .list-row {
        grid-template-columns: 1fr;
      }
      .placeholder-kpis {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="navbar navbar-vertical navbar-expand-lg navbar-light bg-white fixed-top">
      <div class="container-fluid d-block p-0">
        <a class="navbar-brand" href="/dashboard">
          <span class="brand-mark">R</span>
          <span>
            <span class="brand-title d-block">Web3 Radar</span>
            <span class="brand-subtitle d-block">监控工作台</span>
          </span>
        </a>
        {{range .Page.SidebarGroups}}
        <div class="sidebar-group">
          <div class="sidebar-group-title">{{.Title}}</div>
          <div class="sidebar-nav">
            {{range .Items}}
            <a href="{{.Href}}" class="sidebar-link {{if eq $.Page.ActiveNav .Key}}active{{end}}">
              <div class="sidebar-link-title">{{.Label}}</div>
              {{if .Subtitle}}<div class="sidebar-link-subtitle">{{.Subtitle}}</div>{{end}}
            </a>
            {{end}}
          </div>
        </div>
        {{end}}
      </div>
    </aside>
    <main class="page-wrapper">
      <div class="page-body">
{{end}}

{{define "shell_end"}}
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js"></script>
</body>
</html>
{{end}}
